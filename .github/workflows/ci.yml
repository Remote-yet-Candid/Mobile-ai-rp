name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Functional validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm export:android
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependency graph
        id: audit
        run: pnpm audit --audit-level high --prod
      - name: Record security outcome
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo '### Security audit'
            echo "Audit step outcome: $AUDIT_OUTCOME"
            echo 'Unresolved advisories and release restrictions: https://github.com/Remote-yet-Candid/Mobile-ai-rp/issues/7'
            echo 'Functional validation and device testing do not waive security review.'
          } >> "$GITHUB_STEP_SUMMARY"
  release-prerequisites:
    name: Release prerequisites
    if: ${{ always() }}
    needs: [verify, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FUNCTIONAL_RESULT: ${{ needs.verify.result }}
      SECURITY_RESULT: ${{ needs.security-audit.result }}
    steps:
      - name: Check automated prerequisites for release review
        run: |
          {
            echo '### Automated release prerequisites'
            echo "Functional validation: $FUNCTIONAL_RESULT"
            echo "Security audit: $SECURITY_RESULT"
            echo 'Formal release additionally requires documented human security review and device acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FUNCTIONAL_RESULT" != success ] || [ "$SECURITY_RESULT" != success ]; then
            echo '::error::Formal release prerequisites are blocked. Gate 0 device testing may proceed independently using the existing draft test APK.'
            exit 1
          fi
