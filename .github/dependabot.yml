version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      expo:
        patterns:
          - 'expo*'
          - '@expo/*'
          - 'react*'
          - '@shopify/flash-list'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
